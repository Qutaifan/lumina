<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #06080c; }
  a { color: #f6f1e7; text-decoration: none; }
  a:hover { color: #ffc178; }
  ::selection { background: rgba(255,178,90,0.3); }
  @keyframes lm-rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes lm-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lm-scale { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
  @keyframes lm-breathe { 0%,100% { opacity: 0.55; transform: scaleX(0.94); } 50% { opacity: 1; transform: scaleX(1); } }
  @keyframes lm-pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 0.95; } }
  @keyframes lm-sweep { 0% { transform: translateX(-120%); } 55%,100% { transform: translateX(220%); } }
</style>
</helmet>
<div ref="{{ rootRef }}" style="position: relative; width: 100%; aspect-ratio: 1792 / 1008; container-type: inline-size; overflow: hidden; background: #06080c; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #f4efe6; --accent: #ffb25a; --plinth: #7fd9e8;">

  <div ref="{{ bgRef }}" style="position: absolute; inset: -3%; animation: lm-scale 2.2s cubic-bezier(0.16,1,0.3,1) both; will-change: transform;">
    <img src="assets/pod-hero.png" alt="Concrete pod residence at dusk with a furnished, warmly lit interior" style="width: 100%; height: 100%; object-fit: cover; filter: saturate(1.22) contrast(1.12) brightness(1.14);" />
  </div>

  <div style="position: absolute; inset: 0; background: radial-gradient(58% 46% at 50% 41%, rgba(255,214,160,0.14) 0%, rgba(255,190,120,0.05) 42%, rgba(0,0,0,0) 70%); mix-blend-mode: screen; pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,6,11,0.88) 0%, rgba(5,8,13,0.34) 12%, rgba(0,0,0,0) 24%), linear-gradient(0deg, rgba(3,5,9,0.9) 0%, rgba(4,6,11,0.34) 13%, rgba(0,0,0,0) 26%); pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(46% 52% at 2% 100%, rgba(3,5,9,0.9) 0%, rgba(3,5,9,0.42) 45%, rgba(0,0,0,0) 78%), radial-gradient(30% 44% at 100% 46%, rgba(4,6,11,0.6) 0%, rgba(0,0,0,0) 72%); pointer-events: none;"></div>
  <div style="position: absolute; inset: 0; box-shadow: inset 0 0 9cqw 2cqw rgba(3,5,9,0.55); pointer-events: none;"></div>

  <div ref="{{ heroRef }}" style="position: absolute; inset: 0; pointer-events: none; will-change: transform;">
    <div style="position: absolute; left: 12.7cqw; right: 3.4cqw; top: 42.6cqw; height: 1.1cqw; border-radius: 50%; background: linear-gradient(90deg, rgba(127,217,232,0) 0%, var(--plinth) 18%, #eafcff 50%, var(--plinth) 82%, rgba(127,217,232,0) 100%); opacity: 0.6; filter: blur(0.5cqw); mix-blend-mode: screen; animation: lm-breathe 6.5s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 8cqw; right: 0cqw; top: 39.5cqw; height: 9cqw; background: radial-gradient(60% 100% at 50% 55%, rgba(127,217,232,0.3) 0%, rgba(127,217,232,0) 70%); filter: blur(1.7cqw); mix-blend-mode: screen; animation: lm-pulse 6.5s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 30cqw; right: 26cqw; top: 13cqw; height: 24cqw; background: radial-gradient(50% 60% at 50% 55%, rgba(255,186,110,0.3) 0%, rgba(255,170,90,0.08) 45%, rgba(255,178,90,0) 74%); filter: blur(2.2cqw); mix-blend-mode: screen; animation: lm-pulse 9s ease-in-out infinite 1s;"></div>
    <div style="position: absolute; left: 14cqw; right: 14cqw; top: 8cqw; height: 34cqw; background: radial-gradient(46% 52% at 50% 50%, rgba(255,236,210,0.1) 0%, rgba(255,236,210,0) 70%); mix-blend-mode: screen;"></div>
  </div>

  <header style="position: absolute; top: 2.3cqw; left: 4.74cqw; right: 4.58cqw; display: flex; align-items: center; justify-content: space-between; gap: 2cqw; animation: lm-fade 1.2s ease 0.1s both;">
    <a href="#" style="display: block; line-height: 0; transition: filter 0.45s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);" style-hover="filter: drop-shadow(0 0 1.6cqw rgba(255,178,90,0.55)); transform: translateY(-0.1cqw);">
      <img src="assets/lumina-logo.png" alt="Lumina" style="display: block; height: 3.3cqw; width: auto; filter: drop-shadow(0 0.15cqw 0.7cqw rgba(0,0,0,0.55)) drop-shadow(0 0 1.4cqw rgba(255,178,90,0.28));" />
    </a>
    <nav style="display: flex; align-items: center; gap: 2.8cqw; font-size: 1.17cqw; font-weight: 300; letter-spacing: 0.03em;">
      <a href="#" style="color: #fdfaf4; padding-bottom: 0.3cqw; border-bottom: 1px solid rgba(255,178,90,0.85);">Home</a>
      <a href="#" style="color: rgba(244,239,230,0.8); padding-bottom: 0.3cqw; border-bottom: 1px solid transparent; transition: color 0.35s ease, border-color 0.35s ease;" style-hover="color: #fff; border-bottom-color: rgba(255,178,90,0.6);">Properties</a>
      <a href="#" style="color: rgba(244,239,230,0.8); padding-bottom: 0.3cqw; border-bottom: 1px solid transparent; transition: color 0.35s ease, border-color 0.35s ease;" style-hover="color: #fff; border-bottom-color: rgba(255,178,90,0.6);">About</a>
      <a href="#" style="color: rgba(244,239,230,0.8); padding-bottom: 0.3cqw; border-bottom: 1px solid transparent; transition: color 0.35s ease, border-color 0.35s ease;" style-hover="color: #fff; border-bottom-color: rgba(255,178,90,0.6);">Agents</a>
      <a href="#" style="color: rgba(244,239,230,0.8); padding-bottom: 0.3cqw; border-bottom: 1px solid transparent; transition: color 0.35s ease, border-color 0.35s ease;" style-hover="color: #fff; border-bottom-color: rgba(255,178,90,0.6);">Contact</a>
    </nav>
  </header>

  <div ref="{{ copyRef }}" style="position: absolute; left: 5cqw; bottom: 3.5cqw; will-change: transform;">
    <h1 style="margin: 0; font-size: 4.7cqw; line-height: 0.88; font-weight: 700; letter-spacing: -0.025em; text-shadow: 0 0.25cqw 1.6cqw rgba(0,0,0,0.85), 0 0 4cqw rgba(0,0,0,0.5);">
      <span style="display: block; animation: lm-rise 1.1s cubic-bezier(0.16,1,0.3,1) 0.35s both;">WHERE</span>
      <span style="display: block; animation: lm-rise 1.1s cubic-bezier(0.16,1,0.3,1) 0.47s both;">LUXURY</span>
      <span style="display: block; animation: lm-rise 1.1s cubic-bezier(0.16,1,0.3,1) 0.59s both;">FINDS ITS</span>
      <span style="display: block; background: linear-gradient(92deg, #fff5e6 0%, var(--accent) 62%, #ffd7a3 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: lm-rise 1.1s cubic-bezier(0.16,1,0.3,1) 0.71s both;">LIGHT</span>
    </h1>
  </div>

  <div ref="{{ cardsRef }}" style="position: absolute; right: 2.06cqw; top: 24.5cqw; display: flex; flex-direction: column; gap: 1.95cqw; align-items: stretch; width: 14.8cqw; will-change: transform;">
    <div style="padding: 1.34cqw 1.67cqw; border-radius: 1cqw; border: 1px solid rgba(255,255,255,0.14); background: linear-gradient(150deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03)); backdrop-filter: blur(1.2cqw); -webkit-backdrop-filter: blur(1.2cqw); box-shadow: 0 1.3cqw 3.3cqw rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18); transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), border-color 0.5s ease; animation: lm-rise 1.1s cubic-bezier(0.16,1,0.3,1) 0.7s both;" style-hover="transform: translateY(-0.35cqw); border-color: rgba(255,178,90,0.5);">
      <div style="font-size: 3cqw; font-weight: 600; letter-spacing: -0.02em; line-height: 1; color: #fffaf2;">180<span style="color: var(--accent);">+</span></div>
      <div style="margin-top: 0.45cqw; font-size: 1.12cqw; font-weight: 300; color: rgba(236,231,222,0.78);">Exclusive Listings</div>
    </div>
    <div style="padding: 1.2cqw 1.67cqw; border-radius: 1cqw; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(150deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02)); backdrop-filter: blur(1.2cqw); -webkit-backdrop-filter: blur(1.2cqw); box-shadow: 0 1.3cqw 3.3cqw rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14); transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), border-color 0.5s ease; animation: lm-rise 1.1s cubic-bezier(0.16,1,0.3,1) 0.84s both;" style-hover="transform: translateY(-0.35cqw); border-color: rgba(255,178,90,0.5);">
      <div style="font-size: 1.17cqw; font-weight: 500; letter-spacing: -0.01em; color: #fffaf2; white-space: nowrap;">Premium Locations</div>
      <div style="margin-top: 0.2cqw; font-size: 1.12cqw; font-weight: 300; color: rgba(236,231,222,0.7);">Worldwide</div>
    </div>
  </div>

  <a href="#" onMouseMove="{{ onCtaMove }}" style="position: absolute; left: 50%; bottom: 3.8cqw; transform: translateX(-50%); display: flex; align-items: center; gap: 1.2cqw; padding: 0.6cqw 0.62cqw 0.6cqw 1.9cqw; border-radius: 999px; border: 1.5px solid var(--accent); background: rgba(20,14,6,0.42); backdrop-filter: blur(0.6cqw); -webkit-backdrop-filter: blur(0.6cqw); box-shadow: 0 0 0 1px rgba(255,178,90,0.18), 0 0 1.5cqw rgba(255,170,70,0.45), 0 0 4cqw rgba(255,150,50,0.28), inset 0 0 1.2cqw rgba(255,178,90,0.14); overflow: hidden; transition: box-shadow 0.5s ease; animation: lm-rise 1.2s cubic-bezier(0.16,1,0.3,1) 0.95s both;" style-hover="box-shadow: 0 0 0 1px rgba(255,178,90,0.3), 0 0 2cqw rgba(255,175,80,0.6), 0 0 6cqw rgba(255,150,50,0.4), inset 0 0 1.6cqw rgba(255,178,90,0.2);">
    <span style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,230,190,0.28) 50%, rgba(255,255,255,0) 100%); width: 40%; animation: lm-sweep 5.5s ease-in-out infinite 1.6s; pointer-events: none;"></span>
    <span style="position: relative; font-size: 1.12cqw; font-weight: 400; letter-spacing: 0.03em; color: #fff8ec; white-space: nowrap;">Book Private Consultation</span>
    <span style="position: relative; display: grid; place-items: center; width: 2.57cqw; height: 2.57cqw; border-radius: 50%; background: #fdf8f0; color: #14100a; font-size: 1.1cqw; box-shadow: 0 0 1cqw rgba(255,200,140,0.5);">↗</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffb25a&quot;,&quot;options&quot;:[&quot;#ffb25a&quot;,&quot;#e8c88a&quot;,&quot;#ff8f5a&quot;,&quot;#cfe0ff&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Light&quot;},&quot;plinthColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7fd9e8&quot;,&quot;options&quot;:[&quot;#7fd9e8&quot;,&quot;#8fa6ff&quot;,&quot;#ffb25a&quot;,&quot;#b7f2d0&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Light&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dusk&quot;,&quot;midnight&quot;,&quot;dawn&quot;],&quot;default&quot;:&quot;dusk&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Light&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.rootRef = React.createRef();
    this.bgRef = React.createRef();
    this.heroRef = React.createRef();
    this.copyRef = React.createRef();
    this.cardsRef = React.createRef();
  }

  componentDidMount() {
    this.applyTheme();
    this.onMove = (e) => {
      const root = this.rootRef.current;
      if (!root || this.props.parallax === false) return;
      const r = root.getBoundingClientRect();
      const s = r.width / 1792;
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      const set = (ref, mx, my) => {
        const el = ref.current;
        if (el) el.style.setProperty('translate', (x * mx * s).toFixed(2) + 'px ' + (y * my * s).toFixed(2) + 'px');
      };
      set(this.bgRef, -22, -13);
      set(this.heroRef, -22, -13);
      set(this.copyRef, 14, 9);
      set(this.cardsRef, 18, 11);
    };
    window.addEventListener('mousemove', this.onMove, { passive: true });
  }

  componentDidUpdate() { this.applyTheme(); }

  componentWillUnmount() { window.removeEventListener('mousemove', this.onMove); }

  applyTheme() {
    const root = this.rootRef.current;
    if (!root) return;
    if (this.props.accentColor) root.style.setProperty('--accent', this.props.accentColor);
    if (this.props.plinthColor) root.style.setProperty('--plinth', this.props.plinthColor);
    const mood = this.props.mood || 'dusk';
    const bg = this.bgRef.current && this.bgRef.current.firstElementChild;
    if (bg) {
      const f = { dusk: 'saturate(1.22) contrast(1.12) brightness(1.14)', midnight: 'saturate(0.9) contrast(1.18) brightness(0.82) hue-rotate(-10deg)', dawn: 'saturate(1.3) contrast(1.08) brightness(1.3) hue-rotate(8deg)' };
      bg.style.filter = f[mood] || f.dusk;
    }
  }

  renderVals() {
    return {
      rootRef: this.rootRef,
      bgRef: this.bgRef,
      heroRef: this.heroRef,
      copyRef: this.copyRef,
      cardsRef: this.cardsRef,
      onCtaMove: (e) => {
        const el = e.currentTarget;
        const r = el.getBoundingClientRect();
        const dx = ((e.clientX - r.left) / r.width - 0.5) * 8;
        el.style.setProperty('translate', dx.toFixed(2) + 'px 0');
      }
    };
  }
}
</script>
</body>
</html>
